editor.name.tooltip=What this connection is called in the panel. Any name you like.
editor.driver.tooltip=Built-in drivers are downloaded from Maven Central on first use and cached. Choose "Custom JDBC driver…" to supply your own jar.
editor.host.tooltip=Server host name or address, used to build the JDBC URL.
editor.port.tooltip=Server port. Left at the driver's conventional port unless you change it.
editor.database.tooltip=Database (or catalogue) name, used to build the JDBC URL.
editor.build.url.tooltip=Fill the JDBC URL in from the host, port and database above, overwriting whatever is there.
editor.url.tooltip=The URL actually used to connect. Build it from the fields above, or type or paste one directly.
editor.driver.class.tooltip=Fully qualified driver class, e.g. org.h2.Driver.
editor.driver.jar.tooltip=Local jar containing that driver class. It is loaded in its own classloader, so it cannot clash with anything else.
editor.browse.tooltip=Choose the driver jar.
editor.username.tooltip=Leave blank when the URL carries its own credentials or the database wants none - you will then never be asked for a password.
editor.password.tooltip=Only used to connect. It is never written to the profile.
editor.show.password.tooltip=Show what you have typed, to check it before connecting.
editor.remember.tooltip=Store the password in the OS credential store - Windows Credential Manager, macOS Keychain, or the Linux Secret Service. Never in a settings file.
editor.use.ssl.tooltip=Ask the driver for an encrypted connection, using whichever property the selected driver understands.
editor.status.tooltip=Result of Test Connection, and any problem with the form.
